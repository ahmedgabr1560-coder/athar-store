<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تفاصيل المنتج | ATHAR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .product-page { padding: 110px 0 80px; }
    .product-detail { display: grid; grid-template-columns: 1fr; gap: 40px; align-items: start; }
    @media (min-width: 900px) { .product-detail { grid-template-columns: 1fr 1fr; gap: 60px; } }
    .product-gallery { position: relative; }
    .main-image { width: 100%; aspect-ratio: 3/4; border-radius: var(--radius); overflow: hidden; background: #eee; }
    .main-image img { width: 100%; height: 100%; object-fit: cover; }
    .product-info-detail h1 { font-size: clamp(1.5rem, 3vw, 2rem); font-weight: 700; margin-bottom: 12px; line-height: 1.3; }
    .product-price-detail { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
    .product-price-detail .current { font-size: 1.6rem; font-weight: 700; color: var(--gold-dark); }
    [data-theme="dark"] .product-price-detail .current { color: var(--gold); }
    .product-price-detail .old { font-size: 1.1rem; color: var(--text-muted); text-decoration: line-through; }
    .product-price-detail .discount-tag { background: var(--gold); color: #111; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 20px; }
    .product-desc { color: var(--text-muted); font-size: 15px; line-height: 1.8; margin-bottom: 28px; }
    .option-group { margin-bottom: 24px; }
    .option-group label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 12px; }
    .option-group label span { font-weight: 400; color: var(--text-muted); margin-right: 6px; }
    .size-options, .color-options { display: flex; flex-wrap: wrap; gap: 10px; }
    .size-btn { min-width: 48px; height: 44px; padding: 0 14px; border: 1.5px solid var(--border); border-radius: 8px; background: transparent; color: var(--text); font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; transition: var(--transition); }
    .size-btn:hover, .size-btn.active { border-color: var(--gold); background: var(--gold); color: #111; }
    .color-btn { width: 36px; height: 36px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: var(--transition); position: relative; }
    .color-btn.active { border-color: var(--gold); box-shadow: 0 0 0 2px var(--off-white), 0 0 0 4px var(--gold); }
    [data-theme="dark"] .color-btn.active { box-shadow: 0 0 0 2px var(--charcoal), 0 0 0 4px var(--gold); }
    .qty-row { display: flex; align-items: center; gap: 16px; margin-bottom: 28px; }
    .qty-control-lg { display: flex; align-items: center; border: 1.5px solid var(--border); border-radius: 10px; overflow: hidden; }
    .qty-control-lg button { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: var(--cream); color: var(--text); font-size: 18px; font-weight: 600; transition: var(--transition); }
    [data-theme="dark"] .qty-control-lg button { background: rgba(255,255,255,0.08); }
    .qty-control-lg button:hover { background: var(--gold); color: #111; }
    .qty-control-lg span { width: 50px; text-align: center; font-weight: 700; font-size: 16px; }
    .add-cart-btn { width: 100%; max-width: 320px; justify-content: center; padding: 16px 28px; font-size: 16px; }
    .product-meta { margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--border); font-size: 13px; color: var(--text-muted); }
    .product-meta p { margin-bottom: 6px; }
    .back-link { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--text-muted); margin-bottom: 24px; transition: var(--transition); }
    .back-link:hover { color: var(--gold); }
    .not-found { text-align: center; padding: 80px 20px; }
    .not-found h2 { margin-bottom: 16px; }
  </style>
</head>
<body>
  <header class="header" id="header">
    <div class="header-inner">
      <div class="header-left">
        <a href="cart.html" class="icon-btn cart-btn" aria-label="السلة">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M6 6h15l-1.5 9h-12z"></path>
            <circle cx="9" cy="20" r="1"></circle>
            <circle cx="18" cy="20" r="1"></circle>
            <path d="M6 6L5 2H2"></path>
          </svg>
          <span class="cart-count">0</span>
        </a>
        <button class="icon-btn" aria-label="الحساب">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="8" r="4"></circle>
            <path d="M4 20c0-4 4-6 8-6s8 2 8 6"></path>
          </svg>
        </button>
      </div>
      <a href="index.html" class="logo">
        <span class="logo-mark">A</span>
        <span class="logo-text">ATHAR</span>
        <span class="logo-sub">MEN'S FASHION</span>
      </a>
      <nav class="nav">
        <a href="index.html#home" class="nav-link">الرئيسية</a>
        <a href="index.html#products" class="nav-link">المنتجات</a>
        <a href="index.html#categories" class="nav-link">الأقسام</a>
        <a href="index.html#about" class="nav-link">من نحن</a>
        <a href="index.html#contact" class="nav-link">تواصل معنا</a>
      </nav>
      <div class="header-right">
        <button class="theme-toggle" id="themeToggle" aria-label="تبديل الوضع">
          <svg class="sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
          </svg>
          <svg class="moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
        <button class="menu-toggle" id="menuToggle" aria-label="القائمة">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>
  <div class="mobile-menu" id="mobileMenu">
    <a href="index.html#home">الرئيسية</a>
    <a href="index.html#products">المنتجات</a>
    <a href="index.html#categories">الأقسام</a>
    <a href="index.html#about">من نحن</a>
    <a href="index.html#contact">تواصل معنا</a>
  </div>
  <section class="product-page">
    <div class="container">
      <a href="index.html#products" class="back-link">← العودة للمنتجات</a>
      <div id="productContent"></div>
    </div>
  </section>
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <p>© 2026 ATHAR | أَثَر. جميع الحقوق محفوظة.</p>
      </div>
    </div>
  </footer>
  <script src="script.js"></script>
  <script>
    const DEFAULT_PRODUCTS = [
      { id: 'بولو-شيرت-كلاسيك-399', name: 'بولو شيرت كلاسيك', price: 399, oldPrice: 499, discount: 20, image: 'https://images.unsplash.com/photo-1617137968427-85924c800a22?q=80&w=800&auto=format&fit=crop', description: 'بولو شيرت كلاسيك من القطن الفاخر، تصميم أنيق يناسب الإطلالات اليومية والرسمية الكاجوال. خامة مريحة وتهوية ممتازة.', sizes: ['S', 'M', 'L', 'XL', 'XXL'], colors: [{ name: 'أسود', hex: '#1a1a1a' }, { name: 'أبيض', hex: '#f5f5f5' }, { name: 'كحلي', hex: '#1e3a5f' }, { name: 'رمادي', hex: '#6b7280' }] },
      { id: 'قميص-كتان-صيفي-479', name: 'قميص كتان صيفي', price: 479, oldPrice: 599, discount: 20, image: 'https://images.unsplash.com/photo-1596755094514-f87e34085b2c?q=80&w=800&auto=format&fit=crop', description: 'قميص كتان صيفي خفيف ومريح، مثالي للأجواء الحارة. قصة عصرية مع تفاصيل أنيقة.', sizes: ['S', 'M', 'L', 'XL'], colors: [{ name: 'بيج', hex: '#d4b896' }, { name: 'أبيض', hex: '#f5f5f5' }, { name: 'أزرق فاتح', hex: '#93c5fd' }] },
      { id: 'هودي-بغطاء-رأس-529', name: 'هودي بغطاء رأس', price: 529, oldPrice: 649, discount: 18, image: 'https://images.unsplash.com/photo-1556821840-3a63f95609a7?q=80&w=800&auto=format&fit=crop', description: 'هودي سميك ودافئ مع غطاء رأس، مناسب للشتاء والخروجات الكاجوال. قماش قطني عالي الجودة.', sizes: ['M', 'L', 'XL', 'XXL'], colors: [{ name: 'أسود', hex: '#1a1a1a' }, { name: 'رمادي غامق', hex: '#374151' }, { name: 'كحلي', hex: '#1e3a5f' }] },
      { id: 'تيشيرت-قطن-فاخر-349', name: 'تيشيرت قطن فاخر', price: 349, oldPrice: null, discount: null, image: 'https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?q=80&w=800&auto=format&fit=crop', description: 'تيشيرت من القطن الفاخر 100%، ناعم على البشرة ومقاوم للانكماش. أساسي في كل خزانة.', sizes: ['S', 'M', 'L', 'XL', 'XXL'], colors: [{ name: 'أبيض', hex: '#f5f5f5' }, { name: 'أسود', hex: '#1a1a1a' }, { name: 'رمادي', hex: '#9ca3af' }, { name: 'زيتي', hex: '#4b5563' }] }
    ];
    let selectedSize = null, selectedColor = null, quantity = 1, currentProduct = null;
    function getProductById(id) {
      const admin = getAdminProducts();
      let p = admin.find(x => x.id === id || x.name.replace(/\s+/g, '-') + '-' + x.price === id);
      if (p) return { ...p, description: p.description || 'منتج رجالي فاخر من ATHAR. جودة عالية وتصميم عصري.', sizes: p.sizes || ['S', 'M', 'L', 'XL'], colors: p.colors || [{ name: 'أسود', hex: '#1a1a1a' }, { name: 'أبيض', hex: '#f5f5f5' }, { name: 'كحلي', hex: '#1e3a5f' }] };
      return DEFAULT_PRODUCTS.find(x => x.id === id) || DEFAULT_PRODUCTS[0];
    }
    function renderProduct() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id') || params.get('name');
      currentProduct = getProductById(id);
      if (!currentProduct) { document.getElementById('productContent').innerHTML = '<div class="not-found"><h2>المنتج غير موجود</h2><a href="index.html#products" class="btn btn-gold">العودة للمنتجات</a></div>'; return; }
      document.title = currentProduct.name + ' | ATHAR';
      selectedSize = currentProduct.sizes[0]; selectedColor = currentProduct.colors[0]?.name || ''; quantity = 1;
      const oldPriceHtml = currentProduct.oldPrice ? `<span class="old">${currentProduct.oldPrice} ج.م</span>` : '';
      const discountHtml = currentProduct.discount ? `<span class="discount-tag">خصم ${currentProduct.discount}%</span>` : '';
      const sizesHtml = currentProduct.sizes.map((s, i) => `<button class="size-btn ${i===0?'active':''}" data-size="${s}" onclick="selectSize('${s}', this)">${s}</button>`).join('');
      const colorsHtml = currentProduct.colors.map((c, i) => `<button class="color-btn ${i===0?'active':''}" style="background:${c.hex}" title="${c.name}" data-color="${c.name}" onclick="selectColor('${c.name}', this)"></button>`).join('');
      document.getElementById('productContent').innerHTML = `
        <div class="product-detail">
          <div class="product-gallery"><div class="main-image"><img src="${currentProduct.image}" alt="${currentProduct.name}" id="mainImg" /></div></div>
          <div class="product-info-detail">
            <h1>${currentProduct.name}</h1>
            <div class="product-price-detail"><span class="current">${currentProduct.price} ج.م</span>${oldPriceHtml}${discountHtml}</div>
            <p class="product-desc">${currentProduct.description}</p>
            <div class="option-group"><label>المقاس <span id="selectedSizeLabel">— ${selectedSize}</span></label><div class="size-options">${sizesHtml}</div></div>
            <div class="option-group"><label>اللون <span id="selectedColorLabel">— ${selectedColor}</span></label><div class="color-options">${colorsHtml}</div></div>
            <div class="option-group"><label>الكمية</label><div class="qty-row"><div class="qty-control-lg"><button onclick="changeQty(-1)">−</button><span id="qtyValue">1</span><button onclick="changeQty(1)">+</button></div></div></div>
            <button class="btn btn-gold add-cart-btn" onclick="addProductToCart()">أضف إلى السلة</button>
            <div class="product-meta"><p>✓ شحن سريع لجميع المحافظات</p><p>✓ إمكانية الإرجاع خلال 14 يوم</p><p>✓ دفع آمن عند الاستلام أو أونلاين</p></div>
          </div>
        </div>`;
    }
    function selectSize(size, el) { selectedSize = size; document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active')); el.classList.add('active'); document.getElementById('selectedSizeLabel').textContent = '— ' + size; }
    function selectColor(color, el) { selectedColor = color; document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active')); el.classList.add('active'); document.getElementById('selectedColorLabel').textContent = '— ' + color; }
    function changeQty(delta) { quantity = Math.max(1, quantity + delta); document.getElementById('qtyValue').textContent = quantity; }
    function addProductToCart() {
      if (!currentProduct) return;
      const id = currentProduct.id + '-' + selectedSize + '-' + selectedColor;
      const name = `${currentProduct.name} (${selectedSize} / ${selectedColor})`;
      for (let i = 0; i < quantity; i++) addToCart({ id, name, price: currentProduct.price, image: currentProduct.image });
      const btn = document.querySelector('.add-cart-btn');
      btn.textContent = 'تمت الإضافة ✓'; btn.style.background = '#27ae60';
      setTimeout(() => { btn.textContent = 'أضف إلى السلة'; btn.style.background = ''; }, 1500);
    }
    document.addEventListener('DOMContentLoaded', () => { renderProduct(); updateCartCount(); });
  </script>
</body>
</html>
